<main id="character-selection" class="full-screen-modal">
    <div class="auth-wrapper fade-in" style="max-width: 800px;">
        <h1 class="pocket-logo cinzel">Seus<span>Personagens</span></h1>
        
        <div class="premium-card" style="padding: 2rem;">
            <p class="txt-center muted-text" style="margin-bottom: 2rem;">Escolha um personagem para entrar na aventura ou crie um novo.</p>
            
            <div id="characters-list-grid" class="selection-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem;">
                <!-- Personagens serão inseridos aqui dinamicamente -->
            </div>

            <div style="margin-top: 3rem; text-align: center;">
                <button id="btn-back-to-role-from-selection" class="btn-ghost" style="font-size: 0.9rem;">
                    <svg style="width: 16px; margin-right: 8px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    Voltar
                </button>
            </div>
        </div>
    </div>
</main>
