<main id="history-view" class="full-screen-modal">
    <div class="sheet-container read-only fade-in">
        <!-- CABEÇALHO COM NAVEGAÇÃO -->
        <header class="sheet-header premium-card read-only" style="margin-bottom: 1rem;">
            <div class="header-main">
                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <div class="char-portrait-container">
                        👤
                        <img id="display-photo" src="" alt="Avatar" class="char-portrait" style="display: none;">
                    </div>

                    <div class="header-identity">
                        <input type="text" id="display-name" class="char-name-input protected-field"
                            value="Herói Sem Nome" readonly maxlength="25">
                        <div class="header-sub">
                            <div class="badge-role" id="display-class">Guerreiro</div>
                            <div class="badge-role" id="display-race">Humano</div>
                            <div class="badge-role" id="display-level">Nível 1</div>
                            <div class="badge-role" id="display-xp">XP 0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="header-nav">
                <button class="nav-btn" data-view="sheet-view">
                    <span>Ficha</span>
                </button>
                <button class="nav-btn" data-view="items-view">
                    <span>Itens</span>
                </button>
                <button class="nav-btn" data-view="history-view">
                    <span>História</span>
                </button>
                <button class="nav-btn" id="btn-back-to-role" style="color: var(--txt-muted);">
                    <span>Voltar</span>
                </button>
                <button class="nav-btn btn-reset" id="btn-reset-char" style="color: var(--red);">
                    <span>Excluir</span>
                </button>

            </div>
        </header>
        <div class="sheet-body history-grid">
            <!-- 7. ALMA E PERSONALIDADE -->
            <div class="premium-card group-flex">
                <div class="section-title">
                    <label class="label-tiny" style="margin-bottom:0;">Alma e Personalidade</label>
                </div>

                <div class="form-group">
                    <div class="detail-item">
                        <label class="label-tiny">Antecedente</label>
                        <textarea id="display-bg" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                    <div class="detail-item">
                        <label class="label-tiny">Alinhamento</label>
                        <textarea id="display-align" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                    <div class="detail-item">
                        <label class="label-tiny">Traços de Personalidade</label>
                        <textarea id="rp-traits" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                    <div class="detail-item">
                        <label class="label-tiny">Ideais</label>
                        <textarea id="rp-ideals" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                    <div class="detail-item">
                        <label class="label-tiny">Vínculos</label>
                        <textarea id="rp-bonds" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                    <div class="detail-item">
                        <label class="label-tiny">Fraquezas</label>
                        <textarea id="rp-flaws" class="rp-textarea" maxlength="500"
                            style="min-height: 2.2rem; overflow: hidden;"></textarea>
                    </div>
                </div>

            </div>

            <!-- NARRATIVA DO GRUPO E MUNDO -->
            <div class="premium-card group-flex">
                <div class="section-title">
                    <label class="label-tiny" style="margin-bottom:0;">O Elo dos Desengonçados</label>
                    <span class="info-icon" data-tip="A origem do grupo e o que os une.">i</span>
                </div>
                <textarea id="lore-group" class="rp-textarea large-textarea" maxlength="1500" placeholder="A origem do grupo..."></textarea>
            </div>

            <div class="premium-card group-flex">
                <div class="section-title">
                    <label class="label-tiny" style="margin-bottom:0;">História do Mundo</label>
                    <span class="info-icon" data-tip="Informações gerais sobre o cenário da campanha.">i</span>
                </div>
                <textarea id="lore-world" class="rp-textarea large-textarea" maxlength="2000" placeholder="Detalhes sobre o mundo..."></textarea>
            </div>

            <div class="premium-card group-flex">
                <div class="section-title">
                    <label class="label-tiny" style="margin-bottom:0;">NPCs e Contatos</label>
                    <span class="info-icon" data-tip="Aliados e figuras importantes encontradas na jornada.">i</span>
                </div>
                <textarea id="lore-npcs" class="rp-textarea large-textarea" maxlength="2000" placeholder="Lista de aliados e inimigos..."></textarea>
            </div>

            <!-- ZONA DE PERIGO (Apenas para NPCs) -->
            <div id="npc-danger-zone" class="premium-card group-flex" style="display: none; border-color: rgba(255,0,0,0.3); background: rgba(255,0,0,0.05);">
                <div class="section-title">
                    <label class="label-tiny" style="color: var(--red);">Zona de Perigo</label>
                </div>
                <p class="muted-text" style="font-size: 0.75rem; margin-bottom: 1rem;">Cuidado! Esta ação apagará permanentemente este NPC do seu Bestiário local.</p>
                <button class="btn-ghost" id="btn-delete-current-npc" style="color: var(--red); border-color: var(--red); width: 100%; padding: 0.6rem;">Deletar NPC Permanentemente</button>
            </div>
        </div>
    </div>
</main>
