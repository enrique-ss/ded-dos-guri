<main id="master-panel" class="full-screen-modal master-panel-container">
    <!-- Botão flutuante para mostrar a sidebar quando estiver oculta -->
    <button id="master-sidebar-toggle" class="master-sidebar-toggle">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
    </button>

    <div class="master-hub-layout fade-in">
        
        <!-- Sidebar do Mestre -->
        <aside id="master-sidebar" class="master-sidebar premium-card sidebar-hidden">
            
            <nav class="sidebar-nav">
                <button class="m-nav-btn admin-only" data-tab="users" style="display: none;">
                    <span>Usuários</span>
                </button>
                <button class="m-nav-btn active" data-tab="players">
                    <span>Jogadores</span>
                </button>
                <button class="m-nav-btn" data-tab="initiative">
                    <span>Batalha</span>
                </button>
                <button class="m-nav-btn" data-tab="bestiary">
                    <span>NPCs</span>
                </button>
                <button class="m-nav-btn" data-tab="log">
                    <span>Histórico</span>
                </button>
                <button class="m-nav-btn" data-tab="notes">
                    <span>Notas</span>
                </button>
            </nav>

            <div style="margin-top: auto;">
                <button class="m-nav-btn" id="btn-master-exit" style="color: var(--txt-muted); width: 100%;">
                    <span>Voltar</span>
                </button>
            </div>
        </aside>

        <!-- Área de Conteúdo Dinâmica -->
        <section class="master-content">
            
            <!-- ABA: JOGADORES -->
            <div id="m-tab-players" class="m-tab-content active">
                <div class="m-tab-header">
                    <h2 class="cinzel">Jogadores</h2>
                </div>
                <div id="master-grid" class="master-grid-layout m-empty-state">
                    <p>Aguardando jogadores entrarem...</p>
                </div>
            </div>

            <div id="m-tab-initiative" class="m-tab-content">
                <div class="m-tab-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 class="cinzel">Batalha</h2>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-ghost" id="btn-end-battle" onclick="window.endBattle()" style="padding: 0.5rem 1rem; color: var(--red); border-color: var(--red); font-size: 0.8rem; display: none;">Encerrar Batalha</button>
                        <button class="btn-primary" onclick="window.startBattleSetup()" style="padding: 0.5rem 1rem; font-size: 0.8rem;">Iniciar Batalha</button>
                    </div>
                </div>
                <div id="initiative-list" class="initiative-list m-empty-state">
                    <p>Nenhuma batalha ativa no momento.</p>
                </div>
            </div>

            <!-- ABA: NPCs -->
            <div id="m-tab-bestiary" class="m-tab-content">
                <div class="m-tab-header">
                    <h2 class="cinzel">NPCs</h2>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-primary" onclick="startNPCCreation()" style="padding: 0.5rem 1.2rem; font-size: 0.8rem;">Criar NPC</button>
                        <button class="btn-ghost" onclick="window.openNPCGeneratorSetup()" style="padding: 0.5rem 1.2rem; font-size: 0.8rem;">Gerar NPC</button>
                    </div>
                </div>
                <div id="npcs-grid" class="master-grid-layout m-empty-state">
                    <p>Sua lista de NPCs está vazia. Gere novos desafios!</p>
                </div>
            </div>

            <div id="m-tab-log" class="m-tab-content">
                <div class="m-tab-header" style="justify-content: space-between; display: flex; align-items: center;">
                    <h2 class="cinzel">Histórico</h2>
                    <button class="btn-ghost" onclick="clearMasterLog()" style="padding: 0.5rem 1rem; color: var(--red); border-color: var(--red); font-size: 0.8rem;">Limpar Histórico</button>
                </div>
                <div id="master-log-history" class="log-history m-empty-state">
                    <p>Nenhuma atividade registrada ainda.</p>
                </div>
            </div>

            <div id="m-tab-users" class="m-tab-content">
                <div class="m-tab-header">
                    <h2 class="cinzel">Usuários</h2>
                    <button class="btn-primary" onclick="loadUsers()">Atualizar</button>
                </div>
                <div id="users-list" class="m-empty-state">
                    <p>Configurando banco de dados...</p>
                </div>
            </div>

            <div id="m-tab-notes" class="m-tab-content">
                <div class="m-tab-header">
                    <h2 class="cinzel">Notas</h2>
                </div>
                <textarea id="master-private-notes" class="rp-textarea" placeholder="História, NPCs secretos, tesouros escondidos..." style="min-height: 60vh; width: 100%; border-radius: 12px; padding: 1.5rem;"></textarea>
            </div>

        </section>
    </div>
</main>
