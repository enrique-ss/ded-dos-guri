<main id="sheet-view" class="full-screen-modal">
    <div id="sheet-container" class="sheet-container read-only fade-in">

        <!-- CABEÇALHO COM NAVEGAÇÃO -->
        <header class="sheet-header premium-card read-only" style="margin-bottom: 1rem;">
            <div class="header-main">
                <div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                    <div class="char-portrait-container">
                        👤
                        <img id="display-photo" src="" alt="Avatar" class="char-portrait" style="display: none;">
                    </div>

                    <div class="header-identity">
                        <input type="text" id="display-name" class="char-name-input protected-field" value="Herói Sem Nome" readonly maxlength="25">
                        <div class="header-sub">
                            <div class="badge-role cinzel" id="display-class">Guerreiro</div>
                            <div class="badge-role cinzel" id="display-race">Humano</div>
                            <div class="badge-role cinzel" id="display-level" style="background: var(--gold); color: #000;">Nível 1</div>
                            <div class="badge-role cinzel" id="display-xp" style="border-color: var(--gold);">XP 0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="header-nav">
                <button class="nav-btn" data-view="sheet-view">
                    <span>Ficha</span>
                </button>
                <button class="nav-btn" data-view="items-view">
                    <span>Itens</span>
                </button>
                <button class="nav-btn" data-view="history-view">
                    <span>História</span>
                </button>
                <button class="nav-btn btn-reset" id="btn-reset-char" style="color: var(--red);">
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <div class="sheet-body">
            <!-- ================= COLUNA ESQUERDA ================= -->
            <div class="sheet-col">

                <!-- 2. ATRIBUTOS BASE -->
                <div class="premium-card">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Atributos</label>
                        <span class="info-icon" data-tip="Seis pilares que definem quem você é:&#10;&#10;• Força (FOR): Músculos e potência física.&#10;• Destreza (DES): Agilidade, reflexos e equilíbrio.&#10;• Constituição (CON): Saúde, vigor e resistência.&#10;• Inteligência (INT): Memória, lógica e estudo.&#10;• Sabedoria (SAB): Percepção, intuição e bom senso.&#10;• Carisma (CAR): Força de personalidade e lábia.&#10;&#10;VALOR vs MODIFICADOR:&#10;O número grande (ex: 15) é o valor base. O número pequeno (ex: +2) é o MODIFICADOR.&#10;&#10;CONTA: (Valor - 10) dividido por 2.&#10;&#10;IMPORTANTE: O modificador é somado em todos os seus d20. Se você tem FOR +2 e rola um 14 no dado, seu total é 16!">i</span>
                    </div>
                    <div class="attributes-grid">
                        <div class="attr-block" data-attr="for">
                            <div class="attr-circle" id="val-for">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Força</label>
                            </div>
                            <div class="attr-mod" id="mod-for">+0</div>
                        </div>
                        <div class="attr-block" data-attr="des">
                            <div class="attr-circle" id="val-des">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Destreza</label>
                            </div>
                            <div class="attr-mod" id="mod-des">+0</div>
                        </div>
                        <div class="attr-block" data-attr="con">
                            <div class="attr-circle" id="val-con">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Constituição</label>
                            </div>
                            <div class="attr-mod" id="mod-con">+0</div>
                        </div>
                        <div class="attr-block" data-attr="int">
                            <div class="attr-circle" id="val-int">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Inteligência</label>
                            </div>
                            <div class="attr-mod" id="mod-int">+0</div>
                        </div>
                        <div class="attr-block" data-attr="sab">
                            <div class="attr-circle" id="val-sab">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Sabedoria</label>
                            </div>
                            <div class="attr-mod" id="mod-sab">+0</div>
                        </div>
                        <div class="attr-block" data-attr="car">
                            <div class="attr-circle" id="val-car">10</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Carisma</label>
                            </div>
                            <div class="attr-mod" id="mod-car">+0</div>
                        </div>
                    </div>
                </div>

            </div>

            <!-- ================= COLUNA CENTRAL ================= -->
            <div class="sheet-col">
                       <!-- 5. BLOCO DE COMBATE -->
                <div class="premium-card">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Combate</label>
                        <span class="info-icon" data-tip="REGRA DE SOBREVIVÊNCIA:&#10;&#10;• Vida (HP): Sua 'energia vital'. Se chegar a 0, você cai inconsciente.&#10;&#10;• Armadura (CA): O número que o inimigo precisa atingir para te dar dano.&#10;Cálculo: 10 + Mod. Destreza + Bônus de Itens (Escudo, Armadura).&#10;&#10;• Iniciativa: Sua velocidade em perceber o perigo. Decide quem joga primeiro no combate (Mod. Destreza).&#10;&#10;• Deslocamento: Quantos metros você corre em um turno.&#10;&#10;• Dados de Vida: Seus 'kits médicos' naturais. Em um Descanso Curto, role-os para recuperar vida sem gastar poções.&#10;&#10;• Resgate da Morte: Se cair a 0 HP, role d20 todo turno. 10+ é sucesso, <10 é falha. 3 sucessos estabilizam; 3 falhas matam seu herói.">i</span>
                    </div>

                    <div class="combat-stats" style="grid-template-columns: 1fr 1fr;">
                        
                        <!-- 1. Pontos de Vida -->
                        <div class="combat-stat-item" style="background: rgba(255, 62, 77, 0.1); border: 1px solid rgba(255, 62, 77, 0.3);">
                            <label class="label-tiny" style="color: var(--red);">Pontos de Vida</label>
                            <div id="hp-text" class="stat-big" style="color: var(--red); cursor: pointer;">10 / 10</div>
                        </div>

                        <!-- 2. Dados de Vida -->
                        <div class="combat-stat-item">
                            <label class="label-tiny">Dados de Vida</label>
                            <input type="text" id="display-hd" class="stat-big" value="1d10" readonly title="Dados de Vida" style="padding: 0;">
                        </div>

                        <!-- 3. Armadura -->
                        <div class="combat-stat-item">
                            <label class="label-tiny">Armadura</label>
                            <input type="number" id="display-ac" class="stat-big" value="10" readonly title="Classe de Armadura" style="padding: 0;">
                        </div>

                        <!-- 4. Iniciativa -->
                        <div class="combat-stat-item">
                            <label class="label-tiny">Iniciativa</label>
                            <div id="display-initiative" class="stat-big" style="cursor: pointer;">0</div>
                        </div>

                        <!-- 5. Deslocamento -->
                        <div class="combat-stat-item">
                            <label class="label-tiny">Deslocamento</label>
                            <div id="display-speed" class="stat-big">9m</div>
                        </div>

                        <!-- 6. Resgate da Morte -->
                        <div class="combat-stat-item">
                            <label class="label-tiny" style="margin-bottom:0.5rem;">Resgate da Morte</label>
                            <div class="death-saves" style="flex-direction: column; gap: 0.3rem;">
                                <div class="d-save-group">
                                    <div class="dot-check ds-success"></div>
                                    <div class="dot-check ds-success"></div>
                                    <div class="dot-check ds-success"></div>
                                </div>
                                <div class="d-save-group">
                                    <div class="dot-check ds-fail"></div>
                                    <div class="dot-check ds-fail"></div>
                                    <div class="dot-check ds-fail"></div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

                <!-- PERÍCIAS (SKILLS) -->
                <div class="premium-card" style="flex: 1;">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Perícias</label>
                        <span class="info-icon" data-tip="AÇÕES ESPECIALIZADAS:&#10;&#10;Representam tarefas específicas do dia a dia (mentir, pular, observar).&#10;&#10;COMO CALCULAR:&#10;Bônus = Modificador do Atributo correspondente.&#10;&#10;TREINAMENTO (PROFICIÊNCIA):&#10;Se a bolinha estiver marcada, significa que você é treinado (Proficiente) e soma o seu 'Bônus de Proficiência' (+2 no início) no total.&#10;&#10;EXEMPLO: Se você tem DES +2 e é treinado em Furtividade (+2), seu bônus total é +4. Você rola o dado d20 e soma esse +4.">i</span>
                    </div>
                    <div class="skills-list" id="skills-list"></div>
                </div>

            </div>

            <!-- ================= COLUNA DIREITA ================= -->
            <div class="sheet-col">
                
                <!-- INSPIRAÇÃO, PROFICIÊNCIA E SALVAGUARDAS -->
                <div class="premium-card" style="flex: 1;">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Bônus e Salvaguardas</label>
                        <span class="info-icon" data-tip="REGRAS ESPECIAIS:&#10;&#10;• Inspiração: O mestre te dá por uma jogada épica. Você 'gasta' ela para ganhar VANTAGEM (rola 2 d20 e usa o maior resultado).&#10;&#10;• Proficiência: Um bônus que aumenta conforme você fica mais forte (níveis). Representa seu treinamento militar/acadêmico.&#10;&#10;• Salvaguardas: Testes de RESISTÊNCIA. Você usa para evitar perigos impostos a você (ex: desviar de uma explosão ou resistir a um veneno).&#10;&#10;CÁLCULO: Modificador do Atributo + Proficiência (se sua classe for treinada naquele atributo).">i</span>
                    </div>

                    <div class="sub-stats-grid">
                        <div class="attr-block" style="cursor: default;">
                            <div class="attr-circle" id="check-inspiration" style="flex-shrink: 0;">+0</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Inspiração</label>
                            </div>
                        </div>
                        <div class="attr-block" style="cursor: default;">
                            <div class="attr-circle" id="prof-bonus" style="flex-shrink: 0;">+2</div>
                            <div class="attr-info">
                                <label class="label-tiny attr-label">Proficiência</label>
                            </div>
                        </div>
                    </div>

                    <div class="section-title" style="margin-top: 0.6rem;">
                        <label class="label-tiny" style="margin-bottom:0;">Salvaguardas</label>
                    </div>
                    <div class="skills-list saves-list" id="saves-list"></div>
                </div>

            </div>
        </div>

    </div>
</main>
