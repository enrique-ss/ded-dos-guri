<main id="tecnicas-view" class="full-screen-modal">
    <div class="sheet-container fade-in">
        <!-- CABEÇALHO PADRONIZADO (Injetado via JS) -->
        <div class="character-header-placeholder"></div>
        
        <div class="sheet-body tecnicas-two-columns">
            <!-- COLUNA ESQUERDA: Arsenal & Inventário -->
            <div class="tecnicas-column">
                <!-- Arsenal Ofensivo -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Arsenal Ofensivo</label>
                        <span class="info-icon" data-tip="ARMA E ATAQUES:&#10;&#10;• Bônus: O que você soma no d20 para acertar o golpe.&#10;• Dano: O dado que você rola para tirar vida do inimigo se acertar.">i</span>
                    </div>
                    <div id="attacks-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-attack" style="border-style: dashed; padding: 0.6rem 1rem; font-size: 0.8rem;">+ Ofensivo</button>
                </div>

                <!-- Defensivo -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Defensivo</label>
                        <span class="info-icon" data-tip="PROTEÇÃO:&#10;&#10;Aqui você lista escudos, capas mágicas ou armaduras.&#10;&#10;AUTOMAÇÃO: O bônus é somado à sua CA na aba principal.">i</span>
                    </div>
                    <div id="armors-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-armor" style="border-style: dashed; padding: 0.5rem; font-size: 0.75rem;">+ Item</button>
                </div>

                <!-- Inventário -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Inventário</label>
                        <span class="info-icon" data-tip="COISAS ÚTEIS:&#10;&#10;Poções, tochas, cordas e itens de história.">i</span>
                    </div>
                    <div id="utility-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-utility" style="border-style: dashed; padding: 0.5rem; font-size: 0.75rem;">+ Item</button>
                </div>
            </div>

            <!-- COLUNA DIREITA: Magias & Truques -->
            <div class="tecnicas-column">
                <!-- Truques -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Truques</label>
                        <span class="info-icon" data-tip="MAGIAS BÁSICAS (CANTRIPS):&#10;&#10;Magias simples que não gastam espaços de magia.">i</span>
                    </div>
                    <div id="cantrips-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-cantrip" style="border-style: dashed; padding: 0.6rem 1rem; font-size: 0.8rem;">+ Truque</button>
                </div>

                <!-- Magias Ativas -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Magias Ativas</label>
                        <span class="info-icon" data-tip="MAGIAS PREPARADAS:&#10;&#10;Magias prontas para uso imediato hoje.">i</span>
                    </div>
                    <div id="spells-active-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-spell-active" style="border-style: dashed; padding: 0.5rem; font-size: 0.75rem;">+ Magia</button>
                </div>

                <!-- Magias no Grimório -->
                <div class="premium-card group-flex">
                    <div class="section-title">
                        <label class="label-tiny" style="margin-bottom:0;">Magias no Grimório</label>
                        <span class="info-icon" data-tip="CONHECIMENTO ADORMECIDO:&#10;&#10;Magias que você conhece, mas não estão preparadas.">i</span>
                    </div>
                    <div id="spells-inactive-list" class="attacks-list"></div>
                    <button class="btn-ghost" id="add-spell-inactive" style="border-style: dashed; padding: 0.5rem; font-size: 0.75rem;">+ Magia</button>
                </div>
            </div>
        </div>
    </div>
</main>
