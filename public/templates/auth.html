<section id="auth-screen" class="full-screen-modal">
    <div class="auth-wrapper">
        <h1 class="pocket-logo cinzel">D&D<span>dosGuri</span></h1>
        
        <div class="auth-card-container">
            <div id="auth-inner-card" class="auth-card-inner">
                
                <!-- FRONT: LOGIN -->
                <div class="premium-card auth-card auth-side auth-front">
                    <div id="login-form" class="auth-section">
                        <h2 class="cinzel highlight-text" style="margin-bottom: 1.5rem;">Entrar na Taverna</h2>
                        
                        <div class="form-group" style="margin-bottom: 1rem; text-align: left;">
                            <label class="label-tiny">E-mail</label>
                            <input type="email" id="auth-email" placeholder="nome@reino.com" class="premium-input">
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                            <label class="label-tiny">Sua Senha</label>
                            <input type="password" id="auth-password" placeholder="••••••••" class="premium-input">
                        </div>
                        
                        <div class="auth-actions-row">
                            <button class="btn-ghost" onclick="toggleAuthMode('signup')" style="flex: 1; border-radius: 12px; padding: 1.1rem;">
                                Criar Conta
                            </button>
                            <button class="btn-primary" onclick="handleAuth('login')" style="flex: 1.5; border-radius: 12px; padding: 1.1rem;">
                                Continuar
                            </button>
                        </div>
                    </div>
                </div>

                <!-- BACK: SIGNUP -->
                <div class="premium-card auth-card auth-side auth-back">
                    <div id="signup-form" class="auth-section">
                        <h2 class="cinzel highlight-text" style="margin-bottom: 1.5rem;">Nova Jornada</h2>
                        
                        <div class="form-group" style="margin-bottom: 1rem; text-align: left;">
                            <label class="label-tiny">E-mail</label>
                            <input type="email" id="signup-email" placeholder="aventureiro@reino.com" class="premium-input">
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 1.5rem; text-align: left;">
                            <label class="label-tiny">Escolha uma Senha</label>
                            <input type="password" id="signup-password" placeholder="••••••••" class="premium-input">
                        </div>
                        
                        <div class="auth-actions-row">
                            <button class="btn-ghost" onclick="toggleAuthMode('login')" style="flex: 1; border-radius: 12px; padding: 1.1rem;">
                                Voltar
                            </button>
                            <button class="btn-primary" onclick="handleAuth('signup')" style="flex: 1.5; border-radius: 12px; padding: 1.1rem;">
                                Cadastrar
                            </button>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        
        <p class="muted-text txt-center" style="font-size: 0.7rem; margin-top: 2rem; opacity: 0.5;">
            Powered by Supabase & Ethereal Engine v13
        </p>
    </div>
</section>
