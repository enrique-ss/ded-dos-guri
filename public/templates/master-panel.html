<main id="master-panel" class="full-screen-modal">
    <div class="master-hub-layout">
        <aside id="master-sidebar" class="master-sidebar">
            <div class="sidebar-header">
                <div class="master-brand-mark">
                    <img src="resources/favicon.png" alt="Logo do D&D dos Guri" class="master-brand-logo">
                </div>
                <div class="master-brand-full">
                    <img src="resources/favicon.png" alt="Logo do D&D dos Guri" class="master-brand-logo">
                </div>
            </div>

            <div class="sidebar-nav" style="flex:1; overflow-y:auto;">
                <button class="m-nav-btn active" data-tab="mesa" type="button"><span class="m-nav-icon">🎲</span><span class="m-nav-text">Personagens</span></button>
                <button class="m-nav-btn" data-tab="initiative" type="button"><span class="m-nav-icon">⚔️</span><span class="m-nav-text">Batalha</span></button>
                <button class="m-nav-btn" data-tab="bestiary" type="button"><span class="m-nav-icon">🧙</span><span class="m-nav-text">NPCs</span></button>
                <button class="m-nav-btn" data-tab="monsters" type="button"><span class="m-nav-icon">🐉</span><span class="m-nav-text">Bestiário</span></button>
                <button class="m-nav-btn" data-tab="log" type="button"><span class="m-nav-icon">📜</span><span class="m-nav-text">Historico</span></button>
                <button class="m-nav-btn" data-tab="rules" type="button"><span class="m-nav-icon">📖</span><span class="m-nav-text">Regras</span></button>
            </div>

            <div class="master-sidebar-bottom">
                <button id="btn-master-exit" class="m-nav-btn" type="button"><span class="m-nav-icon" style="color:var(--red);">🚪</span><span class="m-nav-text" style="color:var(--red);">Sair</span></button>
            </div>
        </aside>

        <div class="master-content">
            <section id="m-tab-mesa" class="m-tab-content active premium-card">
                <div class="m-header" style="margin-bottom: 1rem;">
                    <div class="m-header-info">
                        <h2 class="cinzel">Personagens</h2>
                        <p style="margin-top: 0.2rem; font-size: 0.85rem; opacity: 0.7;">Gerencie os personagens ativos na mesa e salvos no banco de dados.</p>
                    </div>
                    <div class="m-header-actions">
                        <button class="btn-primary" type="button" onclick="window.openCharacterCreationModal()">Criar Personagem</button>
                        <button class="btn-ghost" type="button" onclick="window.syncDbCharacters()" style="padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: center;">🔄 Atualizar</button>
                    </div>
                </div>
                
                <div class="char-filters" style="display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; width: 100%; border-bottom: 1px solid var(--panel-border); padding-bottom: 1rem;">
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn-ghost active char-filter-btn" data-filter="all" onclick="window.setCharFilter('all')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">Todos</button>
                        <button class="btn-ghost char-filter-btn" data-filter="active" onclick="window.setCharFilter('active')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">🎲 Ativos na Mesa</button>
                        <button class="btn-ghost char-filter-btn" data-filter="inactive" onclick="window.setCharFilter('inactive')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">📚 Apenas no Banco</button>
                    </div>
                    <input type="text" id="char-search" class="premium-input" placeholder="Buscar herói..." style="width: 240px; padding: 0.5rem 1rem; font-size: 0.9rem;" oninput="window.filterDbCharacters()">
                </div>
                
                <div id="mesa-grid" class="m-grid"></div>
            </section>

            <section id="m-tab-initiative" class="m-tab-content premium-card">
                <div class="m-header">
                    <div class="m-header-info">
                        <h2 class="cinzel">Batalha</h2>
                    </div>
                    <div class="m-header-actions">
                        <button id="btn-start-battle" class="btn-primary" type="button" onclick="window.startBattleSetup()">Iniciar batalha</button>
                        <button id="btn-end-battle" class="btn-ghost" type="button" onclick="window.endBattle()" style="display:none; color: var(--red); border-color: var(--red);">Encerrar batalha</button>
                    </div>
                </div>
                <div id="initiative-list" class="initiative-list"></div>
            </section>

            <section id="m-tab-bestiary" class="m-tab-content premium-card">
                <div class="m-header">
                    <div class="m-header-info">
                        <h2 class="cinzel">NPCs</h2>
                    </div>
                    <div class="m-header-actions">
                        <button class="btn-primary" type="button" onclick="window.openNPCGeneratorSetup()">Gerar NPC</button>
                    </div>
                </div>
                <div id="npcs-grid" class="m-grid"></div>
            </section>

            <section id="m-tab-monsters" class="m-tab-content premium-card">
                <div class="m-header">
                    <div class="m-header-info">
                        <h2 class="cinzel">Bestiario</h2>
                    </div>
                    <div class="m-header-actions">
                        <button class="btn-primary" type="button" onclick="window.openMonsterGeneratorSetup()">Gerar criatura</button>
                    </div>
                </div>
                <div id="monsters-grid" class="m-grid"></div>
            </section>



            <section id="m-tab-log" class="m-tab-content premium-card">
                <div class="m-header">
                    <div class="m-header-info">
                        <h2 class="cinzel">Historico da Sessao</h2>
                    </div>
                    <div class="m-header-actions">
                        <button class="btn-ghost" type="button" onclick="window.clearMasterLog()" style="color: var(--red); border-color: var(--red);">Limpar historico</button>
                    </div>
                </div>
                <div id="master-log-history" class="log-history"></div>
            </section>

            <section id="m-tab-rules" class="m-tab-content premium-card">
                <div class="m-header">
                    <div class="m-header-info">
                        <h2 class="cinzel">Regras do D&D 5e</h2>
                    </div>
                    <div class="m-header-actions">
                        <input type="text" id="rules-search" class="premium-input" placeholder="Buscar regra..." style="width: 240px; padding: 0.5rem 1rem; font-size: 0.9rem;" oninput="window.filterRules()">
                    </div>
                </div>
                
                <div class="rules-filters" style="display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <button class="btn-ghost active rules-filter-btn" data-filter="all" onclick="window.setRulesFilter('all')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">Todas</button>
                    <button class="btn-ghost rules-filter-btn" data-filter="battle" onclick="window.setRulesFilter('battle')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">⚔️ Combate</button>
                    <button class="btn-ghost rules-filter-btn" data-filter="adventure" onclick="window.setRulesFilter('adventure')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">🌲 Aventura</button>
                    <button class="btn-ghost rules-filter-btn" data-filter="states" onclick="window.setRulesFilter('states')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">🤢 Estados</button>
                    <button class="btn-ghost rules-filter-btn" data-filter="actions" onclick="window.setRulesFilter('actions')" style="padding: 0.5rem 1.2rem; border-radius: 12px; font-size: 0.8rem; font-weight: 700;">⚡ Habilidades</button>
                </div>
                
                <div id="rules-content-container" style="display: flex; flex-direction: column; gap: 1rem; max-height: calc(100vh - 280px); overflow-y: auto; padding-right: 0.5rem;">
                </div>
            </section>

        </div>
    </div>

    <button id="master-sidebar-toggle" class="master-sidebar-toggle" type="button" aria-label="Alternar menu do mestre">☰</button>
</main>
