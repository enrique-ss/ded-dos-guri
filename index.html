<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>D&D dos Guri – Ficha de Personagem</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sheet.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div id="app"></div>
    
    <!-- Áreas Globais de Recebimento do Mestre -->
    <div id="global-alert-banner" class="alert-banner hidden"></div>
    

    <script src="js/config.js"></script>
    <script src="js/data.js"></script>
    <script src="js/core.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/wizard.js"></script>
    <script src="js/master.js"></script>
    <script src="js/events.js"></script>
    <script src="js/templates.js"></script>

    <button id="theme-toggle" class="theme-toggle-btn" aria-label="Alternar tema">
        <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        const rootElement = document.documentElement;
        
        const savedTheme = localStorage.getItem('rpg_theme');
        if (savedTheme === 'light') {
            rootElement.setAttribute('data-theme', 'light');
        }

        themeBtn.addEventListener('click', () => {
            const isLight = rootElement.getAttribute('data-theme') === 'light';
            if (isLight) {
                rootElement.removeAttribute('data-theme');
                localStorage.setItem('rpg_theme', 'dark');
            } else {
                rootElement.setAttribute('data-theme', 'light');
                localStorage.setItem('rpg_theme', 'light');
            }
        });
    </script>
</body>

</html>
