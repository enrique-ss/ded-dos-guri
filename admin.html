<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&D dos Guri – Admin Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Ajustes específicos para o Admin Hub */
        .admin-login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
        }
        .admin-login-card {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
        .user-row {
            display: grid;
            grid-template-columns: 80px 1fr 120px 120px;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--panel-border);
            align-items: center;
        }
        .user-row:hover {
            background: var(--bg-accent);
        }
        .status-badge {
            padding: 0.2rem 0.6rem;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 800;
            background: var(--green);
            color: #000;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN ADMIN -->
    <div id="loginScreen" class="admin-login-screen">
        <div class="admin-login-card premium-card fade-in">
            <h1 class="pocket-logo cinzel" style="font-size: 2rem;">Admin <span>Portal</span></h1>
            <div id="errorMessage" class="muted-text txt-center hidden" style="color: var(--red); margin-bottom: 1rem;"></div>
            
            <form id="loginForm" class="form-group">
                <div class="detail-item">
                    <label class="label-tiny">E-mail</label>
                    <input type="email" id="email" value="admin@rpg.com" required>
                </div>
                <div class="detail-item">
                    <label class="label-tiny">Senha</label>
                    <input type="password" id="password" value="admin123" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 1rem;">Acessar Painel</button>
            </form>
        </div>
    </div>

    <!-- PAINEL ADMIN (Dashboard) -->
    <main id="adminDashboard" class="full-screen-modal" style="display: none; padding: 0;">
        <div class="master-hub-layout fade-in" style="display: flex; height: 100vh;">
            
            <!-- Sidebar -->
            <aside class="master-sidebar premium-card" style="width: 280px; border-radius: 0; border-top: none; border-bottom: none;">
                <div class="sidebar-header">
                    <h1 class="pocket-logo cinzel" style="font-size: 1.5rem; margin: 0;">Admin Hub</h1>
                </div>
                
                <nav class="sidebar-nav" style="margin-top: 2rem;">
                    <button class="m-nav-btn active" data-tab="users">
                        <span>Usuários</span>
                    </button>
                    <button class="m-nav-btn" data-tab="stats" style="opacity: 0.5;">
                        <span>Estatísticas</span>
                    </button>
                </nav>

                <div style="margin-top: auto;">
                    <button class="m-nav-btn" id="logoutBtn" style="color: var(--red); width: 100%;">
                        <span>Sair do Admin</span>
                    </button>
                </div>
            </aside>

            <!-- Área de Conteúdo -->
            <section class="master-content" style="flex: 1; padding: 2rem; overflow-y: auto;">
                
                <div id="tab-users" class="m-tab-content active">
                    <header class="m-tab-header" style="margin-bottom: 2rem; display: flex; justify-content: space-between; align-items: center;">
                        <h2 class="cinzel" style="font-size: 2rem;">Usuários do Sistema</h2>
                        <div class="header-actions">
                            <input type="text" id="searchBox" placeholder="Buscar por email..." class="protected-field" style="width: 250px; display: inline-block;">
                            <button class="btn-primary" onclick="adminPanel.refreshData()" style="padding: 0.6rem 1.2rem; font-size: 0.8rem; margin-left: 1rem;">Atualizar</button>
                        </div>
                    </header>

                    <div class="premium-card">
                        <div class="user-row" style="background: var(--bg-overlay); border-bottom: 2px solid var(--gold);">
                            <label class="label-tiny">ID</label>
                            <label class="label-tiny">E-mail</label>
                            <label class="label-tiny">Personagens</label>
                            <label class="label-tiny">Status</label>
                        </div>
                        <div id="usersContainer">
                            <!-- Injetado via JavaScript -->
                            <div class="muted-text txt-center" style="padding: 3rem;">Carregando banco de dados...</div>
                        </div>
                    </div>
                </div>

            </section>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
